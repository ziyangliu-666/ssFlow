schema_version: 2
market: us-equity
locale: en-US
last_updated: 2026-04-08

# ssFish US Equity persona pack v1 (sketch)
#
# Validates that the persona pack v2 schema is market-agnostic by translating
# the same dataclass into US large-cap equity market participants. Less
# polished than personas/ashare.yaml — this is a 10-persona sketch, not the
# full 14-class panel ashare gets. The point is to demonstrate that the same
# engine + the same loader can run different markets just by swapping yaml.
#
# Reference: docs/persona-pack-spec-v1.md §3 (US equity investor structure)
# Coverage: SIFMA Equity Market Structure Compendium 2024 (retail 17.9% of
# trading volume, institutional ~82%, ETF 19.6% of total).
#
# IMPORTANT: λ_us_equity = 0.30 (lower than A-share because deeper liquidity).
# Pass --lambda-market 0.30 to run_sandbox_simulation, or hardcode in the
# CLI flag override. ssFish defaults to LAMBDA_LITERATURE['ashare'] (0.5)
# unless explicitly overridden.

data_sources:
  - id: sifma-2024
    name: SIFMA Insights Equity Market Structure Compendium 2024
    org: SIFMA
    url: https://www.sifma.org/research/insights/insights-equity-market-structure-compendium
    accessed: 2026-04-08
    note: retail 17.9% of equity volume; ETF 19.6%; ADV 12.2B shares; 75% retail via mobile
  - id: sifma-factbook-2024
    name: 2024 SIFMA Capital Markets Fact Book
    org: SIFMA
    url: https://www.sifma.org/wp-content/uploads/2023/07/2024-SIFMA-Capital-Markets-Factbook.pdf
    accessed: 2026-04-08
  - id: businessofapps-rh-2026
    name: Robinhood Statistics 2026
    org: Business of Apps
    url: https://www.businessofapps.com/data/robinhood-statistics/
    accessed: 2026-04-08
    note: median age 35; 75% of users ≤43; Gen Z + Millennial dominant

personas:

  - id: robinhood_genz_meme
    archetype: Retail (Robinhood Gen Z meme trader)
    sub_archetype: retail_active_meme
    display_name: Mobile-first retail trader, 25-35, Reddit/Twitter informed
    decision_mode: discretionary
    role: directional_speculator
    market_share:
      by_volume: 0.05
      by_holdings: 0.02
      by_account_count: 0.30
      citations:
        - source_id: businessofapps-rh-2026
        - source_id: sifma-2024
          note: retail 17.9% of volume — Gen Z subset is the most active subgroup
    capital_range_cny: [10000, 200000]  # USD-equivalent in CNY for cross-market consistency
    time_horizon_days: [1, 14]
    behavior:
      avg_position_pct: 0.85
      annual_turnover: 12.0
      stop_loss_discipline: low
      reaction_speed: instant
    information:
      primary_sources: [reddit_wsb, twitter_fintwit, youtube_finance, tiktok_stocks]
      ignored: [10K_filings, conference_calls, sell_side_research]
      english_capable: true
    biases:
      momentum_chasing: 0.95
      fomo: 0.95
      meme_following: 0.90
      anchoring_to_entry_price: 0.80
    voice_prompt: |
      You are a Gen Z / younger Millennial Robinhood user. You trade on
      mobile, you check r/wallstreetbets every morning, you've heard of
      EBITDA but you've never built a DCF. You react fast to price moves
      and headlines. You hold positions for days, not months. You buy
      on hype and sell on panic. You have ~$10-200k in your account.
      Reference Reddit and Twitter, not analyst reports.
    sandbox:
      instance_count: 3000
      capital_distribution:
        type: lognormal
        median_cny: 80000
        sigma: 0.9
      initial_position_distribution:
        type: bernoulli
        prob_holding: 0.70
        position_size_pct_when_holding: {type: uniform, min: 0.30, max: 0.80}
      risk:
        max_position_pct: 0.95
        margin_account_pct: 0.30
        leverage_max: 2.0
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: panic_sell_60pct, side: sell, pool: holdings_in_target, fraction: 0.6}
        - {name: yolo_buy_50pct, side: buy, pool: cash, fraction: 0.5}
        - {name: stop_loss_full, side: sell, pool: holdings_in_target, fraction: 1.0}

  - id: mass_affluent_etf_holder
    archetype: Mass-affluent ETF holder
    sub_archetype: retail_passive
    display_name: 35-60, $250k-2M household, 401k+IRA passive index
    decision_mode: passive
    role: long_term_holder
    market_share:
      by_volume: 0.04
      by_holdings: 0.18
      by_account_count: 0.35
      citations:
        - source_id: sifma-factbook-2024
    capital_range_cny: [1500000, 12000000]
    time_horizon_days: [365, 7300]
    behavior:
      annual_turnover: 0.15
      reaction_speed: slow
    information:
      primary_sources: [financial_advisor, vanguard_research, bogleheads]
      ignored: [reddit_wsb, day_trading_alerts]
    biases:
      passive_indexing: 0.95
      tax_loss_harvest_at_year_end: 0.40
    voice_prompt: |
      You are a 40-year-old mass-affluent investor. Your portfolio is mostly
      Vanguard/Fidelity index funds + a 401k. You barely react to single-name
      news. Single-stock holdings are <5% of portfolio. You rebalance once
      per quarter at most.
    sandbox:
      instance_count: 1500
      capital_distribution:
        type: lognormal
        median_cny: 4000000
        sigma: 1.0
      initial_position_distribution:
        type: bernoulli
        prob_holding: 0.40
        position_size_pct_when_holding: {type: uniform, min: 0.01, max: 0.05}
      risk:
        max_position_pct: 0.05
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: rebalance_trim_2pct, side: sell, pool: holdings_in_target, fraction: 0.02}
        - {name: dca_buy_1pct, side: buy, pool: cash, fraction: 0.01}

  - id: mutual_fund_long_only
    archetype: Mutual Fund (Vanguard/Fidelity active equity)
    sub_archetype: institution_long_only
    display_name: $1-50B AUM active equity fund, benchmark-aware
    decision_mode: discretionary
    role: institutional_long_only
    market_share:
      by_volume: 0.15
      by_holdings: 0.20
      by_account_count: 0.0001
    capital_range_cny: [7000000000, 350000000000]
    time_horizon_days: [90, 730]
    behavior:
      avg_position_pct: 0.95
      annual_turnover: 1.0
    biases:
      benchmark_hugging: 0.75
      tracking_error_aversion: 0.80
    voice_prompt: |
      You are a US large-cap active equity portfolio manager at a major
      mutual fund. You measure yourself against the S&P 500. You hold 50-100
      stocks. You do real fundamental research with channel checks. You
      react to single-name news with 1-3% position changes, not full exits.
    sandbox:
      instance_count: 50
      capital_distribution:
        type: lognormal
        median_cny: 30000000000
        sigma: 1.3
      initial_position_distribution:
        type: bernoulli
        prob_holding: 1.0
        position_size_pct_when_holding: {type: uniform, min: 0.01, max: 0.04}
      risk:
        max_position_pct: 0.05
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: trim_15pct, side: sell, pool: holdings_in_target, fraction: 0.15}
        - {name: add_10pct, side: buy, pool: cash, fraction: 0.10}
        - {name: full_exit, side: sell, pool: holdings_in_target, fraction: 1.0}

  - id: hedge_fund_long_short
    archetype: L/S Hedge Fund
    sub_archetype: institution_active
    display_name: $500M-10B equity L/S fund, fundamental + event-driven
    decision_mode: discretionary
    role: active_long_short
    market_share:
      by_volume: 0.10
      by_holdings: 0.06
      by_account_count: 0.0002
    capital_range_cny: [3500000000, 70000000000]
    time_horizon_days: [10, 180]
    behavior:
      avg_position_pct: 0.85
      annual_turnover: 5.0
      stop_loss_discipline: high
    biases:
      conviction_concentration: 0.85
      contrarian_to_consensus: 0.70
      hard_stop_loss: 0.85
    voice_prompt: |
      You are a US equity long/short hedge fund PM. You can short. You
      run concentrated bets (top 10 = 50% of book). You stop out fast on
      thesis breaks. You react to events within hours, not days.
    sandbox:
      instance_count: 30
      capital_distribution:
        type: lognormal
        median_cny: 10000000000
        sigma: 1.2
      initial_position_distribution:
        type: bernoulli
        prob_holding: 1.0
        position_size_pct_when_holding: {type: uniform, min: 0.02, max: 0.10}
      risk:
        max_position_pct: 0.12
        margin_account_pct: 1.0
        leverage_max: 3.0
        stop_loss_threshold: -0.15
        stop_loss_discipline: 0.90
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: conviction_add_30pct, side: buy, pool: cash, fraction: 0.30}
        - {name: stop_loss_full, side: sell, pool: holdings_in_target, fraction: 1.0}
        - {name: trim_30pct, side: sell, pool: holdings_in_target, fraction: 0.30}

  - id: quant_market_maker
    archetype: Quant Market Maker (Citadel/Virtu/Jane Street)
    sub_archetype: quant
    display_name: HFT/MM book, microsecond reaction, factor + flow
    decision_mode: systematic
    role: market_maker_arb
    market_share:
      by_volume: 0.30
      by_holdings: 0.03
      by_account_count: 0.000001
      citations:
        - source_id: sifma-2024
          note: HFT + market makers dominate intraday volume
    capital_range_cny: [7000000000, 350000000000]
    time_horizon_days: [1, 5]
    behavior:
      annual_turnover: 200.0
      reaction_speed: instant
    biases:
      mean_reversion_intraday: 0.85
      liquidity_first: 0.95
    voice_prompt: |
      You are a US equity market-maker quant. Your decisions are model-driven
      microsecond-to-second. You provide liquidity until the spread becomes
      adverse, then you cut exposure to zero. You don't read news.
    sandbox:
      instance_count: 30
      capital_distribution: {type: lognormal, median_cny: 30000000000, sigma: 1.4}
      initial_position_distribution:
        type: bernoulli
        prob_holding: 1.0
        position_size_pct_when_holding: {type: uniform, min: 0.0001, max: 0.002}
      risk:
        max_position_pct: 0.005
        margin_account_pct: 1.0
        leverage_max: 4.0
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: provide_liquidity_buy_5pct, side: buy, pool: cash, fraction: 0.05}
        - {name: provide_liquidity_sell_5pct, side: sell, pool: holdings_in_target, fraction: 0.05}
        - {name: full_neutralize, side: sell, pool: holdings_in_target, fraction: 1.0}

  - id: pension_fund_long_horizon
    archetype: Pension Fund (CalPERS / state retirement)
    sub_archetype: institution_long_horizon
    display_name: Public pension, $50B-500B AUM, multi-decade horizon
    decision_mode: passive
    role: long_term_holder
    market_share:
      by_volume: 0.02
      by_holdings: 0.10
      by_account_count: 0.000001
    capital_range_cny: [350000000000, 3500000000000]
    time_horizon_days: [1825, 10950]
    behavior:
      annual_turnover: 0.10
      reaction_speed: slow
    voice_prompt: |
      You are a US public pension fund manager. You think in years, not days.
      You hold large blocks of mega-caps. You almost never trade in response
      to single-event news. You're constrained by ESG mandates and asset
      allocation policy.
    sandbox:
      instance_count: 8
      capital_distribution: {type: lognormal, median_cny: 1000000000000, sigma: 1.2}
      initial_position_distribution:
        type: bernoulli
        prob_holding: 0.90
        position_size_pct_when_holding: {type: uniform, min: 0.001, max: 0.005}
      risk:
        max_position_pct: 0.01
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: rebalance_trim_3pct, side: sell, pool: holdings_in_target, fraction: 0.03}
        - {name: rebalance_add_3pct, side: buy, pool: cash, fraction: 0.03}

  - id: sovereign_wealth_long_only
    archetype: Sovereign Wealth Fund (Norway/GIC/ADIA)
    sub_archetype: institution_long_only
    display_name: SWF passive index + selective active, multi-decade
    decision_mode: passive
    role: long_term_holder
    market_share:
      by_volume: 0.02
      by_holdings: 0.05
      by_account_count: 0.0000001
    capital_range_cny: [3500000000000, 35000000000000]
    time_horizon_days: [1825, 10950]
    behavior:
      annual_turnover: 0.05
    voice_prompt: |
      You represent a sovereign wealth fund. You own 1-2% of every large-cap
      US stock as a passive baseline. You have ESG screens and rare exits
      based on geopolitics or strategic divestment. You almost never react
      to single-name news.
    sandbox:
      instance_count: 5
      capital_distribution: {type: lognormal, median_cny: 7000000000000, sigma: 1.0}
      initial_position_distribution:
        type: fixed
        value: 0.005
      risk:
        max_position_pct: 0.01
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: esg_divest, side: sell, pool: holdings_in_target, fraction: 1.0}

  - id: corporate_buyback_program
    archetype: Corporate Buyback (S&P 500 issuer)
    sub_archetype: strategic_corporate_buyback
    display_name: Issuer's own buyback program (10b5-1 plan)
    decision_mode: systematic
    role: strategic_buyer
    market_share:
      by_volume: 0.05
      by_holdings: 0.0
      by_account_count: 0.000001
      citations:
        - source_id: sifma-factbook-2024
          note: Corporate buybacks routinely 4-7% of US equity volume
    time_horizon_days: [30, 365]
    behavior:
      annual_turnover: 1.0
    voice_prompt: |
      You represent the corporate buyback desk for a large-cap S&P 500
      issuer. You buy back shares per a 10b5-1 plan with daily/weekly
      VWAP triggers. You don't react to news in real time, but the
      board adjusts pace quarterly.
    sandbox:
      instance_count: 5
      capital_distribution: {type: lognormal, median_cny: 35000000000, sigma: 1.0}
      initial_position_distribution: {type: fixed, value: 0.0}  # cash to deploy
      risk:
        max_position_pct: 0.02
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: buyback_buy_4pct, side: buy, pool: cash, fraction: 0.04}

  - id: short_seller_activist
    archetype: Activist Short Seller (Hindenburg/Muddy Waters style)
    sub_archetype: institution_short_only
    display_name: Activist short fund publishing thesis-driven short reports
    decision_mode: discretionary
    role: contrarian_short
    market_share:
      by_volume: 0.005
      by_holdings: 0.001
      by_account_count: 0.00001
    time_horizon_days: [30, 365]
    behavior:
      stop_loss_discipline: medium
    voice_prompt: |
      You are an activist short seller. You publish thesis reports designed
      to move price 10-50% in your favor. You short before publishing.
      You react to news that confirms your thesis with more shorts.
    sandbox:
      instance_count: 5
      capital_distribution: {type: lognormal, median_cny: 7000000000, sigma: 1.0}
      initial_position_distribution: {type: fixed, value: 0.10}  # already short
      risk:
        max_position_pct: 0.20
        margin_account_pct: 1.0
        leverage_max: 2.0
      action_space:
        - {name: hold_short, side: none, pool: none, fraction: 0.0}
        - {name: extend_short_15pct, side: sell, pool: holdings_in_target, fraction: 0.15}
        - {name: cover_short_full, side: buy, pool: cash, fraction: 1.0}

  - id: passive_index_etf_inflow
    archetype: Index ETF Inflow Aggregate (SPY/VOO/IVV passive flows)
    sub_archetype: institution_passive
    display_name: Passive index ETF flows aggregated as a single agent class
    decision_mode: systematic
    role: passive_market_maker
    market_share:
      by_volume: 0.20
      by_holdings: 0.30
      by_account_count: 0.000001
      citations:
        - source_id: sifma-2024
          note: ETF 19.6% of US equity volume; passive flows the largest single force
    voice_prompt: |
      You represent the aggregate net flow into S&P 500 / Russell 1000 /
      total-market index ETFs. You don't read news. You buy proportionally
      when retail/401k inflows arrive, sell proportionally on outflows.
    sandbox:
      instance_count: 20
      capital_distribution: {type: lognormal, median_cny: 70000000000, sigma: 1.5}
      initial_position_distribution: {type: fixed, value: 0.005}
      risk:
        max_position_pct: 0.01
      action_space:
        - {name: hold, side: none, pool: none, fraction: 0.0}
        - {name: net_inflow_buy_3pct, side: buy, pool: cash, fraction: 0.03}
        - {name: net_outflow_sell_3pct, side: sell, pool: holdings_in_target, fraction: 0.03}
