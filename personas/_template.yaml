schema_version: 3
market: my-market           # required: short slug for this market (ashare, us-equity, etc.)
locale: en-US               # required: IETF language tag
last_updated: 2026-04-08    # required: ISO date when data sources were last refreshed

# ssFlow persona pack template — copy this file and customize for a new market.
# See personas/SCHEMA.md for the full field reference.
# See personas/ashare.yaml for a polished 30-entity example
# (14 traders + 16 information entities).
#
# Schema v3 supports two kinds of personas:
#   1. TRADER personas (entity_role: trader, with sandbox config) — actually
#      place orders that flow into the Kyle price impact calculation.
#   2. INFORMATION personas (entity_role: media | analyst | regulator |
#      policy | kol | company_ir, no sandbox) — only publish content into
#      the OASIS social stream. Traders read their posts via follow graph.
#
# A good pack covers BOTH: traders for the order book side, info entities
# for the information ecosystem that traders read and react to.

# ── Data sources (at least 1; aim for 5-10 for a polished pack) ────────
data_sources:
  - id: example-source-1
    name: <human readable name>
    org: <publishing org, regulator, or research firm>
    url: https://example.com/report.pdf
    accessed: 2026-04-08
    note: <optional 1-line caveat about what this source covers>

# ── Personas (at least 1; aim for 8-15 covering all major participant classes) ──
personas:

  # ═══════════════════════════════════════════════════════════════
  # EXAMPLE 1: a TRADER persona (has sandbox, actually trades)
  # ═══════════════════════════════════════════════════════════════
  - id: example_trader
    archetype: Example Trader Archetype Label
    sub_archetype: example_sub_category    # optional
    display_name: One-line human description (capital range, age, info source)

    # decision_mode: how this class makes decisions
    #   discretionary - human judgment / fundamental analysis
    #   systematic    - rule-based / quant model / mechanical
    #   strategic     - long-horizon corporate/state actor (use for 大股东/政府)
    #   passive       - mechanical rebalance only
    decision_mode: discretionary

    # role: their function in the market (free-form but recommended values)
    #   directional_speculator | long_term_holder | strategic_holder
    #   commercial_hedger | market_maker_arb | passive_market_maker
    #   quant | sell_side_analyst | short_seller | contrarian_short
    #   active_long_short | institutional_long_only | institutional_long_horizon
    #   foreign_active | passive_buyer
    role: directional_speculator

    # entity_role (Phase I addition): decides what kind of OASIS agent this is
    entity_role: trader

    model: null    # null = use settings.default_model

    # ── follows: who this persona reads in its OASIS feed ──
    # List of other persona ids in the same pack. Special values:
    #   "*"          - follows everyone (use for news aggregators only)
    #   "__market__" - follows the synthetic price-update broadcaster
    #                  (auto-added to all traders, don't list explicitly)
    follows:
      - example_news_wire
      - example_analyst

    # ── Market share (must set at least one dimension) ──
    market_share:
      by_volume: 0.10            # share of daily trading volume contributed
      by_holdings: 0.05          # share of total stock held
      by_account_count: 0.20     # share of total accounts (not always meaningful)
      citations:
        - source_id: example-source-1
          note: <which figure from the source supports this number>

    # ── Demographics (optional but recommended) ──
    capital_range_cny: [50000, 500000]    # min, max wealth in CNY
    time_horizon_days: [1, 90]             # min, max holding period

    # ── Behavior fingerprint (optional) ──
    behavior:
      avg_position_pct: 0.85               # typical % of capital invested at any time
      annual_turnover: 5.0                 # annual turnover ratio (5x = 5 round-trips/year)
      typical_holding_period_days: 14
      stop_loss_discipline: low            # low | medium | high
      reaction_speed: fast                 # instant | fast | medium | slow

    # ── Information environment (optional) ──
    information:
      primary_sources: [source_a, source_b]
      secondary_sources: [source_c]
      ignored: [conference_calls, annual_reports]
      english_capable: false

    # ── Behavioral biases (optional, surfaced into LLM prompt) ──
    biases:
      momentum_chasing: 0.85
      loss_aversion: 0.70
      herd_following: 0.75

    # ── Free-form knowledge (optional, surfaced into LLM prompt) ──
    knowledge:
      typical_holdings: [stock_a, stock_b]
      information_sources: [source_a]
      ignores: [thing_x]

    # ── Voice prompt (REQUIRED, sent to LLM as system prompt) ──
    # Tips:
    #   - Speak in second person ("You represent ...")
    #   - Reference the demographics + behaviors above
    #   - Describe what this class WOULD DO (not what to advise)
    #   - Avoid forbidden vocab: 买入/卖出/建议/应该/减仓/加仓 etc.
    #     Use descriptive language: 进入/离场/倾向 etc.
    voice_prompt: |
      You represent <archetype>. <Description of who they are, what they
      believe, how they react>. Their typical behavior in events:
        - <bullet 1>
        - <bullet 2>
        - <bullet 3>
      Speak in their voice. Don't give advice; describe their reactions.

    # ── Sandbox config (REQUIRED for sandbox-mode runs) ──
    sandbox:
      instance_count: 100        # how many agent instances to spawn per sim

      capital_distribution:
        type: lognormal
        median_cny: 100000       # median agent's capital
        sigma: 0.8               # log-scale spread (0.5=tight, 1.5=heavy tail)
        floor_cny: 10000         # optional clip
        ceiling_cny: 1000000     # optional clip

      initial_position_distribution:
        type: bernoulli
        prob_holding: 0.60       # 60% of agents start holding the target
        position_size_pct_when_holding:
          type: uniform
          min: 0.05              # 5% of capital
          max: 0.30              # 30% of capital

      risk:
        max_position_pct: 0.95   # HARD CAP — buy actions clamped to respect this
        margin_account_pct: 0.10 # informational
        leverage_max: 1.5
        stop_loss_threshold: -0.15
        stop_loss_discipline: 0.50  # probability that stop is executed

      # ── Action space (Gotcha 1: dicts not bare strings) ──
      action_space:
        - name: hold
          side: none             # none | buy | sell
          pool: none             # none | cash | holdings_in_target
          fraction: 0.0
        - name: trim_25pct
          side: sell
          pool: holdings_in_target
          fraction: 0.25
        - name: add_15pct
          side: buy
          pool: cash
          fraction: 0.15
        # add more actions as needed; keep names descriptive (not advisory)

      reaction_lag_rounds:
        type: discrete
        values: [0, 0, 1, 1, 2]  # how many rounds before this class reacts
                                  # informational; not yet used by the engine

    # ── Optional: this trader class also publishes (e.g., fund managers
    # give media interviews). Skip this block for retail traders who don't
    # publish anything.
    publishes:
      - content_type: research_note
        style_hint: "季报口吻, 策略观点"
        trigger_prob: 0.2            # 20% chance of publishing per round
        authority_weight: 0.5
        max_length_chars: 280


  # ═══════════════════════════════════════════════════════════════
  # EXAMPLE 2: an INFORMATION persona (no sandbox, only publishes)
  # ═══════════════════════════════════════════════════════════════
  - id: example_news_wire
    archetype: Example Financial News Wire
    display_name: 快讯媒体 (real-time financial news, 24/7)
    decision_mode: discretionary
    role: information_intermediary
    entity_role: media          # media | news_wire (same thing)

    market_share:
      by_volume: 0.0            # info entities don't trade
      citations:
        - source_id: example-source-1
          note: "info intermediary, not a trader"

    # News wires typically aggregate everything — use "*"
    follows: ["*"]

    voice_prompt: |
      Objective, short, factual news-wire tone. Report what happened
      without giving opinions. Reference specific numbers. No advice.

    publishes:
      - content_type: news_brief
        style_hint: "快讯口吻, 一句话, 客观陈述, 含具体数字"
        trigger_prob: 0.6       # publishes most rounds (news wires are busy)
        authority_weight: 0.7
        max_length_chars: 180

    # NO sandbox block — this persona doesn't trade


  # ═══════════════════════════════════════════════════════════════
  # EXAMPLE 3: an ANALYST persona (publishes research, no trading)
  # ═══════════════════════════════════════════════════════════════
  - id: example_analyst
    archetype: Example Sell-Side Analyst
    display_name: 卖方研究 (industry coverage analyst, buy/hold recs)
    decision_mode: discretionary
    role: information_intermediary
    entity_role: analyst

    market_share:
      by_volume: 0.0
      citations:
        - source_id: example-source-1

    follows:
      - example_news_wire           # reads news wires

    voice_prompt: |
      Rigorous, data-driven sell-side analyst. Cites specific numbers,
      gives reference ranges (not price targets). Tracks competitor data.
      Uses descriptive language ("leaning constructive") not prescriptive.

    publishes:
      - content_type: research_note
        style_hint: "卖方研究风格, 严谨, 带数据, 给参考区间"
        trigger_prob: 0.4
        authority_weight: 0.8
        max_length_chars: 320

    # NO sandbox block
