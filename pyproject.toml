[project]
name = "ssfish"
version = "0.0.1"
description = "A-share event rehearsal engine — multi-persona group reaction simulator"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rufus" }]

dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssfish"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
