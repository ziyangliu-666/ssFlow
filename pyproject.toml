[project]
name = "ssflow"
version = "0.0.3"
description = "ssFlow (ss=$$) — information ecosystem + capital-flow simulation engine (OASIS-based)"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "rufus" }]

dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    # Calibration pipeline deps (persona_factory.py): web search + fetch + parse
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    # Phase I — OASIS social simulation framework (CAMEL-AI).
    # Provides the social ecosystem layer (follow graph + feed + 21 social actions).
    # Our trading layer sits on top via oasis_engine.py.
    "camel-oasis>=0.2.5",
    # Document ingestion for the new /upload + /extract endpoints.
    # pymupdf handles PDFs (multi-column reports); trafilatura extracts the
    # main body from HTML / URLs (strips nav + ads + comments).
    "pymupdf>=1.24.0",
    "trafilatura>=1.12.0",
    # Market data fetchers (market_data.py) — Sina Finance (hit directly
    # via httpx, no library) for A-share; yfinance for US equity, HK,
    # crypto, commodities. akshare stays available as a fallback for
    # exotic A-share lookups but is not imported on the hot path.
    "yfinance>=0.2.40",
    "akshare>=1.12.0",
    # LOB market engine (Phase 0 restructure) — price-level sorted containers.
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
