[project]
name = "ssfish"
version = "0.0.3"
description = "Information ecosystem + market simulation engine (OASIS-based)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "rufus" }]

dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    # Calibration pipeline deps (persona_factory.py): web search + fetch + parse
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    # Phase I — OASIS social simulation framework (CAMEL-AI).
    # Provides the social ecosystem layer (follow graph + feed + 21 social actions).
    # Our trading layer sits on top via oasis_engine.py.
    "camel-oasis>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssfish"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
